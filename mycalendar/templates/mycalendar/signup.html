<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>
    <style>
        :root { 
            --bg: #0d1117;           
            --card-bg: #161b22;      
            --primary: #00ffcc;      
            --primary-glow: rgba(0, 255, 204, 0.4);
            --text-main: #e6edf3;    
            --text-muted: #7d8590;   
            --cell-bg: #21262d;      
            --error-red: #ff4444;
        }
        body.light-mode {
            --bg: #f6f8fa;
            --card-bg: #ffffff;
            --primary: #0969da;
            --primary-glow: rgba(9, 105, 218, 0.2);
            --text-main: #1f2328;
            --text-muted: #57606a;
            --cell-bg: #f0f2f5;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg); 
            color: var(--text-main);
            display: flex; 
            flex-direction: column; 
            align-items: center;    
            padding-top: 60px; 
            margin: 0; 
        }

        .dashboard-container {
            width: 500px;
            max-width: 90%;
        }

        h1 { 
            color: var(--primary); 
            text-shadow: 0 0 12px var(--primary-glow); 
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            font-size: 2.5rem;
        }
        
        .welcome-text { 
            text-align: center; 
            color: var(--text-muted); 
            margin-bottom: 40px; 
            font-size: 1.1rem;
        }
        
        .form-card {
            background: var(--card-bg);
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 30px;
            margin-top: 20px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            background: var(--cell-bg);
            border: 1px solid #30363d;
            border-radius: 5px;
            color: var(--text-main);
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 8px var(--primary-glow);
        }
        
        .submit-btn {
            width: 100%;
            background: var(--primary);
            color: var(--bg);
            font-weight: bold;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .error-message {
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid var(--error-red);
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 20px;
            color: var(--error-red);
            text-align: center;
            font-size: 0.9rem;
        }

        .errorlist {
            color: var(--error-red);
            list-style: none;
            padding: 0;
            margin: 5px 0 0 0;
            font-size: 0.85rem;
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #30363d;
            color: var(--text-muted);
        }
        
        .login-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="dashboard-container">
    
    <h1>RGV Gaming</h1>
    
    <div class="welcome-text">
        Build your gaming loadout profile
    </div>

    <div class="form-card">
        <form method="POST">
            {% csrf_token %}

            {% if form.errors %}
                <div class="error-message">
                    Please fix the errors below.
                </div>
            {% endif %}

            <!-- Username -->
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter username" required>
                {{ form.username.errors }}
            </div>

            <!-- Password -->
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password1" placeholder="Enter password" required>
                {{ form.password1.errors }}
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" name="password2" placeholder="Confirm password" required>
                {{ form.password2.errors }}
            </div>

            <button type="submit" class="submit-btn">
                Sign Up
            </button>

            <div class="login-link">
                Already have an account? 
                <a href="{% url 'login' %}">Log in</a>
            </div>
        </form>
    </div>

</div>
<script>
    if (localStorage.getItem('theme') === 'light') {
        document.body.classList.add('light-mode');
    }
</script>
</body>
</html>
